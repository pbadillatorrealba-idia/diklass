name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

# Cancel superseded runs on rapid pushes; never cancel main, a finished run there is the record.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  quality:
    name: Quality and types
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: .bun-version
      # Not --frozen-lockfile on purpose: install and diff, so a drifted bun.lock fails with a
      # fix hint instead of the opaque "lockfile had changes" (Dependabot bumps package.json
      # without regenerating bun.lock). Every other job keeps --frozen-lockfile.
      - name: Install dependencies and verify bun.lock is in sync
        run: |
          bun install
          git diff --exit-code bun.lock || {
            echo "::error::bun.lock is out of sync with package.json. Run 'bun install' with the pinned Bun (.bun-version) and commit bun.lock."
            exit 1
          }
      - run: bunx biome ci --error-on-warnings .
      - run: bun run typecheck

  unit:
    name: Unit and integration tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: .bun-version
      - run: bun install --frozen-lockfile
      # The live suites under tests/integration skip here: there is no Supabase in this job.
      - run: bun run test

  database:
    name: Supabase database tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: supabase/setup-cli@46f7f98c7f948ad727d22c1e67fab04c223a0520 # v3.0.0
        with:
          version: 2.117.0
      # Deliberately after setup-cli: v3 runs its own setup-bun and would shadow the job's Bun.
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: .bun-version
      - run: bun install --frozen-lockfile
      - name: Start local Supabase
        run: |
          supabase start
          supabase db reset
          status=$(supabase status -o json)
          {
            echo "EXPO_PUBLIC_SUPABASE_URL=$(echo "$status" | jq -r .API_URL)"
            echo "EXPO_PUBLIC_SUPABASE_ANON_KEY=$(echo "$status" | jq -r .ANON_KEY)"
            echo "SUPABASE_URL=$(echo "$status" | jq -r .API_URL)"
            echo "SUPABASE_SERVICE_ROLE_KEY=$(echo "$status" | jq -r .SERVICE_ROLE_KEY)"
          } >> "$GITHUB_ENV"
      - name: pgTap (RLS, triggers, session expiry, attribution)
        run: supabase test db
      - name: Generated database types match the migrations
        run: |
          supabase gen types --lang=typescript --local > "$RUNNER_TEMP/database.types.ts"
          diff -u src/lib/supabase/database.types.ts "$RUNNER_TEMP/database.types.ts"
      - run: bun run provision:veterinarians -- --fixture tests/fixtures/veterinarians.json
      - name: Live integration (access sessions, two clinicians, self-registration)
        run: bun run test:integration
        env:
          SUPABASE_LIVE_TESTS: "1"

  web-e2e:
    name: Web E2E
    runs-on: ubuntu-latest
    needs: quality
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: supabase/setup-cli@46f7f98c7f948ad727d22c1e67fab04c223a0520 # v3.0.0
        with:
          version: 2.117.0
      # Deliberately after setup-cli: v3 runs its own setup-bun and would shadow the job's Bun.
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: .bun-version
      - run: bun install --frozen-lockfile
      - name: Start local Supabase and provision synthetic veterinarians
        run: |
          supabase start
          supabase db reset
          status=$(supabase status -o json)
          {
            echo "EXPO_PUBLIC_SUPABASE_URL=$(echo "$status" | jq -r .API_URL)"
            echo "EXPO_PUBLIC_SUPABASE_ANON_KEY=$(echo "$status" | jq -r .ANON_KEY)"
            echo "SUPABASE_URL=$(echo "$status" | jq -r .API_URL)"
            echo "SUPABASE_SERVICE_ROLE_KEY=$(echo "$status" | jq -r .SERVICE_ROLE_KEY)"
          } >> "$GITHUB_ENV"
      - run: bun run provision:veterinarians -- --fixture tests/fixtures/veterinarians.json
      # Browser downloads dominate this job's setup time; cache them across runs.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-chromium-${{ hashFiles('bun.lock') }}
      - run: bunx playwright install --with-deps chromium
      # Includes tests/e2e/web/accessibility.spec.ts: the axe WCAG 2.2 AA gate.
      - run: bun run test:e2e:web -- --project=chromium

  # Firefox and WebKit run only on push to main to keep pull-request feedback fast, per
  # plan.md's CI design; Chromium above still covers every pull request.
  web-e2e-full-matrix:
    name: Web E2E (Firefox/WebKit)
    runs-on: ubuntu-latest
    if: github.event_name == 'push'
    needs: quality
    strategy:
      fail-fast: false
      matrix:
        project: [firefox, webkit]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: supabase/setup-cli@46f7f98c7f948ad727d22c1e67fab04c223a0520 # v3.0.0
        with:
          version: 2.117.0
      # Deliberately after setup-cli: v3 runs its own setup-bun and would shadow the job's Bun.
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: .bun-version
      - run: bun install --frozen-lockfile
      - name: Start local Supabase and provision synthetic veterinarians
        run: |
          supabase start
          supabase db reset
          status=$(supabase status -o json)
          {
            echo "EXPO_PUBLIC_SUPABASE_URL=$(echo "$status" | jq -r .API_URL)"
            echo "EXPO_PUBLIC_SUPABASE_ANON_KEY=$(echo "$status" | jq -r .ANON_KEY)"
            echo "SUPABASE_URL=$(echo "$status" | jq -r .API_URL)"
            echo "SUPABASE_SERVICE_ROLE_KEY=$(echo "$status" | jq -r .SERVICE_ROLE_KEY)"
          } >> "$GITHUB_ENV"
      - run: bun run provision:veterinarians -- --fixture tests/fixtures/veterinarians.json
      # Browser downloads dominate this job's setup time; cache them across runs.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ matrix.project }}-${{ hashFiles('bun.lock') }}
      - run: bunx playwright install --with-deps ${{ matrix.project }}
      - run: bun run test:e2e:web -- --project=${{ matrix.project }}

  dependency-audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: .bun-version
      - run: bun install --frozen-lockfile
      # Expo/Metro currently pins these vulnerable transitive versions. Bun cannot
      # upgrade them without breaking the parent dependency ranges, so keep the
      # exceptions explicit until the Expo toolchain publishes compatible fixes.
      - run: >
          bun audit
          --ignore GHSA-vcc3-ghjq-m6fr
          --ignore GHSA-w3rx-r6r6-pgpr
          --ignore GHSA-5p2g-fcmc-qvqq
          --ignore GHSA-w5hq-g745-h8pq
