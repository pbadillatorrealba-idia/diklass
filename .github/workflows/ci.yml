name: CI

# Docs-only changes run nothing: no code, so nothing to verify (and no required checks to leave pending).
on:
  pull_request:
    paths-ignore: ["**.md", "docs/**", "openspec/**"]
  push:
    branches: [main]
    paths-ignore: ["**.md", "docs/**", "openspec/**"]

permissions:
  contents: read

# Cancel superseded runs on rapid pushes; never cancel main, a finished run there is the record.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  quality:
    name: Quality and types
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: .bun-version
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: bun-${{ runner.os }}-
      # Not --frozen-lockfile on purpose: install and diff, so a drifted bun.lock fails with a
      # fix hint instead of the opaque "lockfile had changes" (Dependabot bumps package.json
      # without regenerating bun.lock). Every other job keeps --frozen-lockfile.
      - name: Install dependencies and verify bun.lock is in sync
        run: |
          bun install
          git diff --exit-code bun.lock || {
            echo "::error::bun.lock is out of sync with package.json. Run 'bun install' with the pinned Bun (.bun-version) and commit bun.lock."
            exit 1
          }
      - run: bunx biome ci --error-on-warnings .
      - run: bun run typecheck
      - run: bun run check:skills

  unit:
    name: Unit and integration tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: .bun-version
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: bun-${{ runner.os }}-
      - run: bun install --frozen-lockfile
      # The live suites under tests/integration skip here: there is no Supabase in this job.
      - run: bun run test

  # One Supabase for everything that needs it: pgTap, type drift, live integration and the
  # Chromium web E2E (previously a second job and three shards, each booting its own stack).
  database:
    name: Supabase database tests and web E2E
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: supabase/setup-cli@45a513f8c64c0bc8e0e3dfe572b5c95be85f6359 # v3.0.1
        with:
          version: 2.117.0
      # Deliberately after setup-cli: v3 runs its own setup-bun and would shadow the job's Bun.
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: .bun-version
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: bun-${{ runner.os }}-
      - run: bun install --frozen-lockfile
      # Backend local exclusivo: el runner provisiona actores/fixtures y limpia sus IDs.
      - name: Start isolated testing Supabase
        run: |
          bun run test:backend:start
          bun -e 'import {appendFileSync,readFileSync} from "node:fs"; for(const line of readFileSync("test-results/backend.env","utf8").split("\n")){const i=line.indexOf("="); if(i>0) appendFileSync(process.env.GITHUB_ENV!,line.slice(0,i)+"="+JSON.parse(line.slice(i+1))+"\n");}'
      - name: pgTap (RLS, triggers, session expiry, attribution)
        run: supabase test db --workdir test-results/backend
      - name: Generated database types match the migrations
        run: |
          supabase gen types --lang=typescript --local --workdir test-results/backend > "$RUNNER_TEMP/database.types.ts"
          diff -u src/lib/supabase/database.types.ts "$RUNNER_TEMP/database.types.ts"
      - name: Live integration (access sessions, two clinicians, self-registration)
        run: bun run test:integration
        env:
          SUPABASE_LIVE_TESTS: "1"
      # Cada archivo reconcilia y limpia sus recursos; integración y web comparten el baseline.
      # Browser downloads dominate this job's setup time; cache them across runs.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-chromium-${{ hashFiles('bun.lock') }}
      - run: bunx playwright install --with-deps chromium
      # Includes tests/e2e/web/accessibility.spec.ts: the axe WCAG 2.2 AA gate.
      - run: bun run test:e2e:web -- --project=chromium
      # Voice capture with the real (fake-device) microphone: the app is re-exported in real mode
      # with short windows; the transcription function is intercepted, so no OpenAI key is needed.
      - name: Web E2E with the real microphone (listen mode)
        run: bun run test:e2e:web -- modo-escucha-real.spec.ts --project=chromium
        env:
          E2E_CLEAR_CACHE: "1"
          EXPO_PUBLIC_VOZ_MODO: real
          EXPO_PUBLIC_VOZ_VENTANA_MS: "2000"

      - name: Preserve only credential-free cleanup reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: cleanup-${{ github.job }}
          path: test-results/scopes/*.scope.json
          if-no-files-found: ignore

  # Firefox and WebKit run only on push to main to keep pull-request feedback fast, per
  # plan.md's CI design; Chromium above still covers every pull request. One job and one
  # Supabase for both browsers (they run one after the other).
  web-e2e-full-matrix:
    name: Web E2E (Firefox/WebKit)
    runs-on: ubuntu-latest
    if: github.event_name == 'push'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: supabase/setup-cli@45a513f8c64c0bc8e0e3dfe572b5c95be85f6359 # v3.0.1
        with:
          version: 2.117.0
      # Deliberately after setup-cli: v3 runs its own setup-bun and would shadow the job's Bun.
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: .bun-version
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: bun-${{ runner.os }}-
      - run: bun install --frozen-lockfile
      # Backend local exclusivo: el runner provisiona actores/fixtures y limpia sus IDs.
      - name: Start isolated testing Supabase
        run: |
          bun run test:backend:start
          bun -e 'import {appendFileSync,readFileSync} from "node:fs"; for(const line of readFileSync("test-results/backend.env","utf8").split("\n")){const i=line.indexOf("="); if(i>0) appendFileSync(process.env.GITHUB_ENV!,line.slice(0,i)+"="+JSON.parse(line.slice(i+1))+"\n");}'
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-firefox-webkit-${{ hashFiles('bun.lock') }}
      - run: bunx playwright install --with-deps firefox webkit
      - run: bun run test:e2e:web -- --project=firefox --project=webkit

      - name: Preserve only credential-free cleanup reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: cleanup-${{ github.job }}
          path: test-results/scopes/*.scope.json
          if-no-files-found: ignore

  dependency-audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: .bun-version
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: bun-${{ runner.os }}-
      - run: bun install --frozen-lockfile
      # Expo/Metro currently pins these vulnerable transitive versions. Bun cannot
      # upgrade them without breaking the parent dependency ranges, so keep the
      # exceptions explicit until the Expo toolchain publishes compatible fixes.
      # GHSA-vfj7-8cjw-p6xm (braces) and GHSA-86w9-cpqp-85rv (node-forge) have no published fixed
      # version yet; GHSA-rj75-hqrm-r3gf is postcss-selector-parser@6, pinned by tailwindcss@3.
      # All three are build/dev-toolchain only and never ship in the app bundle.
      # GHSA-mrhx-c7xc-m3w5 (zod): the direct dependency is on the fixed 4.6.x; the remaining hit is
      # the zod@3.25.76 pinned by @expo/cli, which has no 3.x fix and is build tooling only.
      # GHSA-gcqx-w48m-w2h4 (deepmerge): sin versión corregida; mitigado con patches/deepmerge@4.3.1.patch.
      # GHSA-qr28-fpjm-wq7f (decode-uri-component): query-string@7 de expo-router pide ^0.2.2 y la 0.5.1
      # corregida es solo ESM, así que un override rompe `require`; DoS por entrada local, sin superficie de servidor.
      - run: >
          bun audit
          --ignore GHSA-gcqx-w48m-w2h4
          --ignore GHSA-qr28-fpjm-wq7f
          --ignore GHSA-vcc3-ghjq-m6fr
          --ignore GHSA-w3rx-r6r6-pgpr
          --ignore GHSA-5p2g-fcmc-qvqq
          --ignore GHSA-w5hq-g745-h8pq
          --ignore GHSA-vfj7-8cjw-p6xm
          --ignore GHSA-86w9-cpqp-85rv
          --ignore GHSA-rj75-hqrm-r3gf
          --ignore GHSA-mrhx-c7xc-m3w5
