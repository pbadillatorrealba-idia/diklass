name: CI

# Docs-only changes run nothing: no code, so nothing to verify (and no required checks to leave pending).
on:
  pull_request:
    paths-ignore: ["**.md", "docs/**", "openspec/**"]
  push:
    branches: [main]
    paths-ignore: ["**.md", "docs/**", "openspec/**"]

permissions:
  contents: read

# Cancel superseded runs on rapid pushes; never cancel main, a finished run there is the record.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  quality:
    name: Quality and types
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: .bun-version
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: bun-${{ runner.os }}-
      # Not --frozen-lockfile on purpose: install and diff, so a drifted bun.lock fails with a
      # fix hint instead of the opaque "lockfile had changes" (Dependabot bumps package.json
      # without regenerating bun.lock). Every other job keeps --frozen-lockfile.
      - name: Install dependencies and verify bun.lock is in sync
        run: |
          bun install
          git diff --exit-code bun.lock || {
            echo "::error::bun.lock is out of sync with package.json. Run 'bun install' with the pinned Bun (.bun-version) and commit bun.lock."
            exit 1
          }
      - run: bunx biome ci --error-on-warnings .
      - run: bun run typecheck

  unit:
    name: Unit and integration tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: .bun-version
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: bun-${{ runner.os }}-
      - run: bun install --frozen-lockfile
      # The live suites under tests/integration skip here: there is no Supabase in this job.
      - run: bun run test

  # One Supabase for everything that needs it: pgTap, type drift, live integration and the
  # Chromium web E2E (previously a second job and three shards, each booting its own stack).
  database:
    name: Supabase database tests and web E2E
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: supabase/setup-cli@46f7f98c7f948ad727d22c1e67fab04c223a0520 # v3.0.0
        with:
          version: 2.117.0
      # Deliberately after setup-cli: v3 runs its own setup-bun and would shadow the job's Bun.
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: .bun-version
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: bun-${{ runner.os }}-
      - run: bun install --frozen-lockfile
      # `db:start` skips the services nothing here uses (same flags as local development); a fresh
      # `supabase start` already applies migrations and seed, so no `db reset` before the tests.
      # `gen types` and `test db` run their own one-off containers, not the excluded services.
      - name: Start local Supabase
        run: |
          bun run db:start
          status=$(supabase status -o json)
          {
            echo "EXPO_PUBLIC_SUPABASE_URL=$(echo "$status" | jq -r .API_URL)"
            echo "EXPO_PUBLIC_SUPABASE_ANON_KEY=$(echo "$status" | jq -r .ANON_KEY)"
            echo "SUPABASE_URL=$(echo "$status" | jq -r .API_URL)"
            echo "SUPABASE_SERVICE_ROLE_KEY=$(echo "$status" | jq -r .SERVICE_ROLE_KEY)"
          } >> "$GITHUB_ENV"
      - name: pgTap (RLS, triggers, session expiry, attribution)
        run: supabase test db
      - name: Generated database types match the migrations
        run: |
          supabase gen types --lang=typescript --local > "$RUNNER_TEMP/database.types.ts"
          diff -u src/lib/supabase/database.types.ts "$RUNNER_TEMP/database.types.ts"
      - run: bun run provision:veterinarians -- --fixture tests/fixtures/veterinarians.json
      - name: Live integration (access sessions, two clinicians, self-registration)
        run: bun run test:integration
        env:
          SUPABASE_LIVE_TESTS: "1"
      # The live suites leave rows in the shared clinic (the source of an earlier flake in the
      # read-resilience tests), so the E2E starts from a freshly reset database.
      - name: Reset the database for the E2E
        run: |
          supabase db reset
          bun run provision:veterinarians -- --fixture tests/fixtures/veterinarians.json
      # Browser downloads dominate this job's setup time; cache them across runs.
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-chromium-${{ hashFiles('bun.lock') }}
      - run: bunx playwright install --with-deps chromium
      # Includes tests/e2e/web/accessibility.spec.ts: the axe WCAG 2.2 AA gate.
      - run: bun run test:e2e:web -- --project=chromium

  # Firefox and WebKit run only on push to main to keep pull-request feedback fast, per
  # plan.md's CI design; Chromium above still covers every pull request. One job and one
  # Supabase for both browsers (they run one after the other).
  web-e2e-full-matrix:
    name: Web E2E (Firefox/WebKit)
    runs-on: ubuntu-latest
    if: github.event_name == 'push'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: supabase/setup-cli@46f7f98c7f948ad727d22c1e67fab04c223a0520 # v3.0.0
        with:
          version: 2.117.0
      # Deliberately after setup-cli: v3 runs its own setup-bun and would shadow the job's Bun.
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: .bun-version
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: bun-${{ runner.os }}-
      - run: bun install --frozen-lockfile
      # A fresh `supabase start` already applies migrations and seed, so no `db reset` here.
      # E2E only needs Postgres, Auth, PostgREST, Kong and Edge Functions (client error
      # reporting); `bun run db:start` skips the rest (same flags as local development).
      - name: Start local Supabase and provision synthetic veterinarians
        run: |
          bun run db:start
          status=$(supabase status -o json)
          {
            echo "EXPO_PUBLIC_SUPABASE_URL=$(echo "$status" | jq -r .API_URL)"
            echo "EXPO_PUBLIC_SUPABASE_ANON_KEY=$(echo "$status" | jq -r .ANON_KEY)"
            echo "SUPABASE_URL=$(echo "$status" | jq -r .API_URL)"
            echo "SUPABASE_SERVICE_ROLE_KEY=$(echo "$status" | jq -r .SERVICE_ROLE_KEY)"
          } >> "$GITHUB_ENV"
      - run: bun run provision:veterinarians -- --fixture tests/fixtures/veterinarians.json
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-firefox-webkit-${{ hashFiles('bun.lock') }}
      - run: bunx playwright install --with-deps firefox webkit
      - run: bun run test:e2e:web -- --project=firefox --project=webkit

  dependency-audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: .bun-version
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: bun-${{ runner.os }}-
      - run: bun install --frozen-lockfile
      # Expo/Metro currently pins these vulnerable transitive versions. Bun cannot
      # upgrade them without breaking the parent dependency ranges, so keep the
      # exceptions explicit until the Expo toolchain publishes compatible fixes.
      # GHSA-vfj7-8cjw-p6xm (braces) and GHSA-86w9-cpqp-85rv (node-forge) have no published fixed
      # version yet; GHSA-rj75-hqrm-r3gf is postcss-selector-parser@6, pinned by tailwindcss@3.
      # All three are build/dev-toolchain only and never ship in the app bundle.
      - run: >
          bun audit
          --ignore GHSA-vcc3-ghjq-m6fr
          --ignore GHSA-w3rx-r6r6-pgpr
          --ignore GHSA-5p2g-fcmc-qvqq
          --ignore GHSA-w5hq-g745-h8pq
          --ignore GHSA-vfj7-8cjw-p6xm
          --ignore GHSA-86w9-cpqp-85rv
          --ignore GHSA-rj75-hqrm-r3gf
