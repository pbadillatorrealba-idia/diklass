# Arize Phoenix local para las trazas y la evaluación del agente (solo desarrollo; datos sintéticos).
#   docker compose -f docker-compose.phoenix.yml up -d     # UI en http://127.0.0.1:6006
# La función `agent` lo usa con PHOENIX_COLLECTOR_ENDPOINT=http://127.0.0.1:6006 (usa 127.0.0.1, no localhost).
# Las trazas contienen entradas y salidas clínicas: no lo expongas fuera de una red privada.
services:
  phoenix:
    image: docker.io/arizephoenix/phoenix:latest
    ports:
      - "127.0.0.1:6006:6006"
      - "127.0.0.1:4317:4317"
    volumes:
      - phoenix-data:/mnt/data
    environment:
      PHOENIX_WORKING_DIR: /mnt/data
volumes:
  phoenix-data:
